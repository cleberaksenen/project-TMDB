services:

  minio:
    image: quay.io/minio/minio
    container_name: minio
    environment:
      MINIO_ROOT_USER: "minioadmin"
      MINIO_ROOT_PASSWORD: "minio@1234!"
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  minio_mc:
    image: quay.io/minio/mc
    container_name: minio_mc
    depends_on:
      - minio
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until mc alias set myminio http://minio:9000 minioadmin 'minio@1234!'; do
          echo "Aguardando o MinIO iniciar..."
          sleep 2
        done
        mc mb --ignore-existing myminio/landing
        echo "Bucket landing criado/verificado com sucesso."

  postgres-airflow:
    image: postgres:15
    container_name: postgres-airflow
    environment:
      POSTGRES_USER: "post_airflow"
      POSTGRES_PASSWORD: "airflow_123"
      POSTGRES_DB: "airflow"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  airflow:
    build:
      context: .
      dockerfile: config_airflow/airflow.Dockerfile
    container_name: airflow
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: "postgresql+psycopg2://post_airflow:airflow_123@postgres-airflow:5432/airflow"
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "True"
      AIRFLOW__LOGGING__LOGGING_LEVEL: "INFO"

      MINIO_ENDPOINT: "http://minio:9000"
      MINIO_ACCESS_KEY: "minioadmin"
      MINIO_SECRET_KEY: "minio@1234!"

    depends_on:
      - postgres-airflow
      - minio

    ports:
      - "8080:8080"

    volumes:
      - ./airflow/dags:/usr/local/airflow/dags

    command: ["airflow", "standalone"]

volumes:
  postgres_data:
  minio_data: